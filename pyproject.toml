[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-merge-queue-scheduler"
version = "0.1.0"
description = "Schedules concurrent agent-authored PRs using file-touch conflict graphs and speculative batch grouping"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agentic-merge-queue-scheduler = "agentic_merge_queue_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_merge_queue_scheduler*"]
